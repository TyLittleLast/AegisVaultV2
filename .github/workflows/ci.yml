name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Every version in the package.json engines range is exercised, so the
      # declared range cannot drift away from what is actually supported.
      # Node 20 is gone: it is end-of-life, and jsdom 30 needs
      # util.markAsUncloneable, which only exists from Node 22 on, so on
      # Node 20 every test worker died before a single test ran.
      matrix:
        node: [22, 24]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        if: matrix.node == 24
        run: npm run build

  # The deployed artefact is a static bundle, so it is worth proving once that
  # the build output contains no plaintext credential or vault data.
  bundle-audit:
    name: Bundle audit
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail on leaked credential-shaped strings
        run: |
          if grep -rniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[-_]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]{16,}' dist; then
            echo "::error::possible secret committed to the bundle"
            exit 1
          fi
          echo "no credential-shaped strings found in dist/"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
