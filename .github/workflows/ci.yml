name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Every version in the package.json engines range is exercised, so the
      # declared range cannot drift away from what is actually supported.
      # Node 20 is gone: it is end-of-life, and jsdom 30 needs
      # util.markAsUncloneable, which only exists from Node 22 on, so on
      # Node 20 every test worker died before a single test ran.
      matrix:
        node: [22, 24]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        if: matrix.node == 24
        run: npm run build

  # The deployed artefact is a static bundle, so it is worth proving once that
  # the build output contains no plaintext credential or vault data.
  #
  # Built with the same PUBLIC_BASE as the deploy job, so what is audited here
  # is byte-for-byte what Pages serves. Auditing a differently-based build
  # would leave the actual artefact unchecked.
  bundle-audit:
    name: Bundle audit
    runs-on: ubuntu-latest
    needs: verify
    env:
      PUBLIC_BASE: /AegisVaultV2/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The CSP is authored by hand while the assets it governs are produced by
      # Vite, which inlines anything under assetsInlineLimit without announcing
      # it. That mismatch shipped a real bug: a @fontsource subset came out as a
      # `url(data:font/woff2;base64,…)` reference that `font-src 'self'`
      # blocked, so glyphs silently fell back to a system face and no build
      # output said so. `assetsInlineLimit: 0` closed it, so the data: branches
      # below are now dormant: they exist to fail loudly if a toolchain change
      # ever inlines an asset again, not to describe the current build.
      - name: Fail when the CSP rejects an asset the build emitted
        run: |
          csp=$(grep -o 'http-equiv="Content-Security-Policy"[^>]*' dist/index.html | sed "s/&#39;/'/g" || true)
          if [ -z "$csp" ]; then
            echo "::error::no Content-Security-Policy meta tag in dist/index.html"
            exit 1
          fi
          # Read one directive's own value. Matching the whole tag instead would
          # accept a source expression belonging to a different directive.
          allows() {
            echo "$csp" | tr ';' '\n' | sed -n "s/^[[:space:]]*$1[[:space:]]*//p" | tr -d ' ' | grep -q "$2"
          }
          check() {
            scheme="$1"
            directive="$2"
            if grep -rq "url(data:${scheme}" dist --include='*.css' && ! allows "$directive" 'data:'; then
              echo "::error::the build emitted a data: ${scheme} but the CSP directive '${directive}' does not allow data: — the browser would block it"
              exit 1
            fi
          }
          check font font-src
          check image img-src

          # The same drift in the other direction: Argon2id is a WASM module
          # behind a hand-written CSP. If a dependency update moves the KDF to
          # another implementation, `script-src` without 'wasm-unsafe-eval'
          # blocks the compile and every unlock fails with no build-time signal.
          if grep -rq 'WebAssembly\.compile\|WebAssembly\.instantiate' dist/assets \
            && ! allows script-src 'wasm-unsafe-eval'; then
            echo "::error::the bundle compiles WebAssembly but the CSP directive 'script-src' does not allow 'wasm-unsafe-eval' — the Argon2id KDF would be blocked at unlock time"
            exit 1
          fi

          echo "CSP allows every inlined data: scheme and the WASM KDF found in dist/"

      - name: Fail on leaked credential-shaped strings
        run: |
          if grep -rniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[-_]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]{16,}' dist; then
            echo "::error::possible secret committed to the bundle"
            exit 1
          fi
          echo "no credential-shaped strings found in dist/"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
